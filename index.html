<!DOCTYPE html>
<html>
<head>
<title>Image Upload</title>
<style>
  #controls {
    display: none;
    align-items: center;
    gap: 16px;
    margin: 10px 0;
    font-family: sans-serif;
    font-size: 14px;
  }
  #controls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #sensitivity {
    width: 160px;
  }
  #imageArea {
    display: none;
  }
  #imageArea.stacked #previewWrapper {
    position: relative;
    resize: both;
    overflow: hidden;
    border: 1px dashed #999;
    width: 300px;
    height: 300px;
    max-width: 100%;
  }
  #imageArea.stacked #edgeCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #imageArea.side-by-side {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  #imageArea.side-by-side #previewWrapper {
    position: relative;
    width: 300px;
    height: 300px;
    border: 1px dashed #999;
    flex-shrink: 0;
  }
  #imageArea.side-by-side #edgeCanvas {
    position: static;
    width: 300px;
    height: 300px;
    border: 1px dashed #999;
    object-fit: contain;
  }
  #preview {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  #details {
    display: none;
    margin-top: 12px;
    font-family: monospace;
    font-size: 13px;
    background: #f4f4f4;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 12px;
    max-width: 500px;
    white-space: pre-wrap;
  }
  #details table {
    border-collapse: collapse;
    width: 100%;
  }
  #details td {
    padding: 2px 8px;
    vertical-align: top;
  }
  #details td:first-child {
    color: #555;
    white-space: nowrap;
  }
  .swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1px solid #999;
    vertical-align: middle;
    margin-right: 6px;
  }
</style>
</head>
<body>
<input type="file" id="fileInput" accept="image/*">
<br>

<div id="controls">
  <label><input type="checkbox" id="sideToggle"> Side-by-side view</label>
  <label>
    Sensitivity:
    <input type="range" id="sensitivity" min="10" max="200" value="80">
    <span id="sensitivityVal">80</span>
  </label>
</div>
<div id="edgeStatus" style="display:none; font-family:sans-serif; font-size:13px; color:#b00; margin:6px 0;"></div>

<div id="imageArea" class="stacked">
  <div id="previewWrapper">
    <img id="preview" src="">
  </div>
  <canvas id="edgeCanvas"></canvas>
</div>

<div id="details"></div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const previewWrapper = document.getElementById('previewWrapper');
const details = document.getElementById('details');
const hiddenCanvas = document.getElementById('hiddenCanvas');
const controls = document.getElementById('controls');
const imageArea = document.getElementById('imageArea');
const edgeCanvas = document.getElementById('edgeCanvas');
const sideToggle = document.getElementById('sideToggle');
const sensitivity = document.getElementById('sensitivity');
const sensitivityVal = document.getElementById('sensitivityVal');
const edgeStatus = document.getElementById('edgeStatus');

let cvReady = false;
let currentImg = null;

function onOpenCvReady() {
  cvReady = true;
  console.log('OpenCV ready');
  if (currentImg) drawShapeOutlines();
}

// This build of opencv.js finishes WASM init synchronously within the
// script's own execution, so `cv` is already fully populated (HEAP
// arrays, getBuildInformation, etc.) by the time the <script> tag's
// load event fires — there's no separate async gap to wait out via
// cv.onRuntimeInitialized. Hook the script's onload instead, per
// OpenCV's own tutorial pattern, with the callback-style path kept as
// a fallback for older builds that DO still need it.
function onOpenCvScriptLoad() {
  if (window.cv && typeof window.cv.getBuildInformation === 'function') {
    onOpenCvReady();
  } else if (window.cv && typeof window.cv.then === 'function') {
    window.cv.then((resolvedCv) => {
      window.cv = resolvedCv;
      onOpenCvReady();
    });
  } else if (window.cv) {
    window.cv['onRuntimeInitialized'] = onOpenCvReady;
  } else {
    // Script tag fired onload but the global isn't there yet in some
    // edge case — give it a brief moment and recheck.
    setTimeout(onOpenCvScriptLoad, 50);
  }
}

// Safety net in case the script somehow finished before this point,
// or onload doesn't fire for a cached/inline case in some browsers.
if (window.cv && typeof window.cv.getBuildInformation === 'function') {
  onOpenCvScriptLoad();
}

function fmt(n, d = 2) {
  return Number(n).toFixed(d);
}

// --- Shape outline detection (all edge/contour work done via OpenCV) ---
function drawShapeOutlines() {
  if (!currentImg) return;
  if (!window.cv || !cvReady) {
    edgeStatus.style.display = 'block';
    edgeStatus.style.color = '#a56b00';
    edgeStatus.textContent = 'OpenCV is still loading — outlines will appear once it finishes.';
    return;
  }

  edgeStatus.style.display = 'none';
  edgeStatus.textContent = '';

  const w = currentImg.naturalWidth;
  const h = currentImg.naturalHeight;

  // Size the edge canvas to match the image's pixel dimensions so drawing
  // coordinates line up 1:1; CSS handles the display scaling.
  edgeCanvas.width = w;
  edgeCanvas.height = h;

  hiddenCanvas.width = w;
  hiddenCanvas.height = h;
  const srcCtx = hiddenCanvas.getContext('2d');
  srcCtx.drawImage(currentImg, 0, 0);

  const highThresh = Number(sensitivity.value);
  const lowThresh = highThresh / 2;

  // Minimum contour area to keep, scaled to image size, so tiny noise
  // specks don't get traced as "shapes".
  const minArea = (w * h) * 0.0005;

  const isSideBySide = imageArea.classList.contains('side-by-side');

  let src, gray, edges, contours, hierarchy;
  try {
    // 1. Load the frame into an OpenCV Mat and convert to grayscale —
    //    same call already used successfully for the edge-density stat.
    src = cv.imread(hiddenCanvas);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    // 2. OpenCV Canny edge detection (same signature already working
    //    for the edge-density stat above, just with slider thresholds).
    edges = new cv.Mat();
    cv.Canny(gray, edges, lowThresh, highThresh);

    // 3. OpenCV contour extraction — outer boundaries only, so a
    //    building/car/stroller traces as one shape rather than every
    //    internal edge.
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

    const ectx = edgeCanvas.getContext('2d');

    if (isSideBySide) {
      // Render OpenCV's own grayscale conversion as the right-hand
      // panel's image (instead of a placeholder), via cv.imshow.
      cv.imshow(edgeCanvas, gray);
    } else {
      // Stacked mode: transparent canvas so only the outline shows,
      // layered directly on top of the photo underneath.
      ectx.clearRect(0, 0, w, h);
    }

    ectx.strokeStyle = '#2979ff';
    ectx.lineWidth = Math.max(2, Math.round(Math.min(w, h) / 250));

    let shapeCount = 0;
    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i);
      const area = cv.contourArea(cnt);
      if (area >= minArea) {
        shapeCount++;
        const pts = cnt.data32S;
        ectx.beginPath();
        for (let p = 0; p < pts.length; p += 2) {
          const x = pts[p], y = pts[p + 1];
          if (p === 0) ectx.moveTo(x, y);
          else ectx.lineTo(x, y);
        }
        ectx.closePath();
        ectx.stroke();
      }
      cnt.delete();
    }

    updateShapeCount(shapeCount);

    if (shapeCount === 0) {
      edgeStatus.style.display = 'block';
      edgeStatus.style.color = '#a56b00';
      edgeStatus.textContent = 'No shapes met the size threshold — try lowering the sensitivity slider.';
    }
  } catch (err) {
    edgeStatus.style.display = 'block';
    edgeStatus.style.color = '#b00';
    edgeStatus.textContent = 'Edge detection error: ' + err.message;
    console.error('Shape outline error:', err);
  } finally {
    [src, gray, edges, contours, hierarchy].forEach(m => {
      if (m && typeof m.delete === 'function') m.delete();
    });
  }
}

function updateShapeCount(count) {
  const existing = document.getElementById('shapeCountRow');
  if (existing) existing.remove();
  if (details.style.display !== 'none') {
    const table = details.querySelector('table');
    if (table) {
      const row = document.createElement('tr');
      row.id = 'shapeCountRow';
      row.innerHTML = `<td>Shapes traced</td><td>${count} (sensitivity ${sensitivity.value})</td>`;
      table.appendChild(row);
    }
  }
}

sensitivity.addEventListener('input', () => {
  sensitivityVal.textContent = sensitivity.value;
  drawShapeOutlines();
});

sideToggle.addEventListener('change', () => {
  if (sideToggle.checked) {
    imageArea.classList.remove('stacked');
    imageArea.classList.add('side-by-side');
  } else {
    imageArea.classList.remove('side-by-side');
    imageArea.classList.add('stacked');
  }
  drawShapeOutlines();
});

function analyzeImage(img, file) {
  details.style.display = 'none';
  details.innerHTML = '';

  hiddenCanvas.width = img.naturalWidth;
  hiddenCanvas.height = img.naturalHeight;
  const ctx = hiddenCanvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const w = img.naturalWidth;
  const h = img.naturalHeight;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  let rSum = 0, gSum = 0, bSum = 0;
  let rMin = 255, gMin = 255, bMin = 255;
  let rMax = 0, gMax = 0, bMax = 0;
  let lumSum = 0, lumSumSq = 0;
  let transparentCount = 0;
  const histBins = 16;
  const lumHist = new Array(histBins).fill(0);
  const pixelCount = w * h;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
    rSum += r; gSum += g; bSum += b;
    if (r < rMin) rMin = r; if (r > rMax) rMax = r;
    if (g < gMin) gMin = g; if (g > gMax) gMax = g;
    if (b < bMin) bMin = b; if (b > bMax) bMax = b;
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    lumSum += lum;
    lumSumSq += lum * lum;
    const bin = Math.min(histBins - 1, Math.floor(lum / (256 / histBins)));
    lumHist[bin]++;
    if (a < 255) transparentCount++;
  }

  const avgR = rSum / pixelCount;
  const avgG = gSum / pixelCount;
  const avgB = bSum / pixelCount;
  const avgLum = lumSum / pixelCount;
  const variance = (lumSumSq / pixelCount) - (avgLum * avgLum);
  const stdDev = Math.sqrt(Math.max(0, variance));
  const aspectRatio = w / h;
  const megapixels = (w * h) / 1e6;

  function toHex(n) {
    return Math.round(n).toString(16).padStart(2, '0');
  }
  const avgHex = '#' + toHex(avgR) + toHex(avgG) + toHex(avgB);

  let edgeInfo = 'unavailable';
  let contourCount = null;
  let dominantOrientation = 'n/a';

  if (window.cv && cvReady) {
    try {
      const src = cv.imread(hiddenCanvas);
      const gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      const edges = new cv.Mat();
      cv.Canny(gray, edges, 50, 150);

      let edgePixelCount = 0;
      for (let i = 0; i < edges.data.length; i++) {
        if (edges.data[i] !== 0) edgePixelCount++;
      }
      const edgeDensity = (edgePixelCount / (w * h)) * 100;
      edgeInfo = fmt(edgeDensity, 2) + '% of pixels';

      const contours = new cv.MatVector();
      const hierarchy = new cv.Mat();
      cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
      contourCount = contours.size();

      const sobelX = new cv.Mat();
      const sobelY = new cv.Mat();
      cv.Sobel(gray, sobelX, cv.CV_32F, 1, 0);
      cv.Sobel(gray, sobelY, cv.CV_32F, 0, 1);
      let sumX = 0, sumY = 0;
      for (let i = 0; i < sobelX.data32F.length; i++) {
        sumX += Math.abs(sobelX.data32F[i]);
        sumY += Math.abs(sobelY.data32F[i]);
      }
      dominantOrientation = sumX > sumY * 1.1 ? 'vertical edges dominant' :
                            sumY > sumX * 1.1 ? 'horizontal edges dominant' : 'balanced';

      src.delete(); gray.delete(); edges.delete();
      contours.delete(); hierarchy.delete();
      sobelX.delete(); sobelY.delete();
    } catch (err) {
      edgeInfo = 'error: ' + err.message;
    }
  }

  const histBar = lumHist.map(v => {
    const pct = v / pixelCount;
    const blocks = Math.round(pct * 40);
    return '\u2588'.repeat(blocks) || '\u00b7';
  }).join('\n');

  const fileSizeKB = file ? (file.size / 1024) : null;

  let html = '<table>';
  html += `<tr><td>File name</td><td>${file ? file.name : 'n/a'}</td></tr>`;
  html += `<tr><td>File size</td><td>${fileSizeKB !== null ? fmt(fileSizeKB, 1) + ' KB' : 'n/a'}</td></tr>`;
  html += `<tr><td>File type</td><td>${file ? file.type : 'n/a'}</td></tr>`;
  html += `<tr><td>Dimensions</td><td>${w} x ${h} px</td></tr>`;
  html += `<tr><td>Megapixels</td><td>${fmt(megapixels, 2)} MP</td></tr>`;
  html += `<tr><td>Aspect ratio</td><td>${fmt(aspectRatio, 3)} (${w}:${h})</td></tr>`;
  html += `<tr><td>Has transparency</td><td>${transparentCount > 0 ? 'yes (' + fmt((transparentCount / pixelCount) * 100, 2) + '% of pixels)' : 'no'}</td></tr>`;
  html += `<tr><td>Average color</td><td><span class="swatch" style="background:${avgHex}"></span>${avgHex} (R ${fmt(avgR, 1)}, G ${fmt(avgG, 1)}, B ${fmt(avgB, 1)})</td></tr>`;
  html += `<tr><td>Channel range R</td><td>${rMin} - ${rMax}</td></tr>`;
  html += `<tr><td>Channel range G</td><td>${gMin} - ${gMax}</td></tr>`;
  html += `<tr><td>Channel range B</td><td>${bMin} - ${bMax}</td></tr>`;
  html += `<tr><td>Avg luminance</td><td>${fmt(avgLum, 2)} / 255</td></tr>`;
  html += `<tr><td>Luminance std dev</td><td>${fmt(stdDev, 2)}</td></tr>`;
  html += `<tr><td>Contrast estimate</td><td>${stdDev > 60 ? 'high' : stdDev > 30 ? 'medium' : 'low'}</td></tr>`;
  html += `<tr><td>Brightness</td><td>${avgLum > 170 ? 'bright' : avgLum > 85 ? 'midtone' : 'dark'}</td></tr>`;
  html += `<tr><td>Edge density</td><td>${edgeInfo}</td></tr>`;
  html += `<tr><td>Contour count</td><td>${contourCount !== null ? contourCount : 'n/a'}</td></tr>`;
  html += `<tr><td>Orientation bias</td><td>${dominantOrientation}</td></tr>`;
  html += `<tr><td>Luminance histogram</td><td><pre style="margin:0">${histBar}</pre></td></tr>`;
  html += '</table>';

  details.innerHTML = html;
  details.style.display = 'block';

  drawShapeOutlines();
}

fileInput.addEventListener('change', function() {
  const file = fileInput.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      preview.src = e.target.result;
      controls.style.display = 'flex';
      imageArea.style.display = imageArea.classList.contains('side-by-side') ? 'flex' : 'block';
      preview.onload = function() {
        currentImg = preview;
        analyzeImage(preview, file);
      };
    };
    reader.readAsDataURL(file);
  } else {
    preview.src = '';
    currentImg = null;
    controls.style.display = 'none';
    imageArea.style.display = 'none';
    details.style.display = 'none';
  }
});
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvScriptLoad()" type="text/javascript"></script>
</body>
</html>
